name: Render Test — Kinetic Text Overlay

# Manual trigger only: this workflow runs when someone clicks
# "Run workflow" on the Actions tab of this repository.
on:
  workflow_dispatch:

jobs:
  render-test:
    name: Render overlay and composite the test video
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Check out the repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install system libraries for the headless browser (best effort)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libnspr4 libdbus-1-3 \
            libatk1.0-0 libatk-bridge2.0-0 libatspi2.0-0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libxkbcommon0 libpango-1.0-0 libcairo2

      - name: 4. Install the project packages (Remotion)
        run: npm install

      - name: 5. Download the headless browser Remotion renders with
        run: npx remotion browser ensure

      - name: 6. Render the kinetic text overlay as a transparent video
        # --image-format=png and --pixel-format=yuva444p10le are what keep
        # the transparency (alpha channel) alive in the ProRes file.
        # Without them the overlay comes out on a solid black background.
        run: >-
          npx remotion render src/index.tsx KineticNumber
          out/kinetic.mov --codec=prores --prores-profile=4444
          --image-format=png --pixel-format=yuva444p10le

      - name: 7. Composite the overlay over the sample clip with FFmpeg
        run: >-
          ffmpeg -y -i assets/sample-bg.mp4 -i out/kinetic.mov
          -filter_complex "[1:v]scale=1280:720[ovl];[0:v][ovl]overlay=0:0:format=auto"
          -t 4 -c:v libx264 -pix_fmt yuv420p -movflags +faststart
          final-test.mp4

      - name: 8. Upload the finished test video as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-test-video
          path: final-test.mp4
          if-no-files-found: error
